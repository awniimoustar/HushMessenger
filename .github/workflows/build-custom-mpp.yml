name: Build HushMessenger v0.30.0 Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-custom-mpp.yml"

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with fresh upstream SysAdminDoc/HushMessenger
        run: |
          cp .github/workflows/build-custom-mpp.yml /tmp/build-custom-mpp.yml
          git remote add upstream https://github.com/SysAdminDoc/HushMessenger.git || git remote set-url upstream https://github.com/SysAdminDoc/HushMessenger.git
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "Upstream HEAD commit: $UPSTREAM_SHA"
          git reset --hard upstream/main
          git clean -fd
          mkdir -p .github/workflows
          cp /tmp/build-custom-mpp.yml .github/workflows/build-custom-mpp.yml

      - name: Bump Version to 0.30.0 and Apply CallRecording Enhancements
        run: |
          python3 - << 'EOF'
          import pathlib, re, time

          # 1. Bump version to 0.30.0 in gradle.properties
          gp = pathlib.Path("gradle.properties")
          g_text = gp.read_text(encoding="utf-8")
          g_text = re.sub(r"^version=.*$", "version=0.30.0", g_text, flags=re.M)
          g_text = re.sub(r"^bundleTimestampMillis=.*$", f"bundleTimestampMillis={int(time.time() * 1000)}", g_text, flags=re.M)
          gp.write_text(g_text, encoding="utf-8")
          print("Updated gradle.properties to version=0.30.0")

          # 2. Apply additional CallRecording.java stability fixes on top of upstream a31f2cf
          p = pathlib.Path("extensions/messenger/src/main/java/app/hushmessenger/extension/CallRecording.java")
          c = p.read_text(encoding="utf-8")
          c = c.replace(
              "if (held == null) playoutHeld = held = Settings.enabled(KEY) && Settings.available(KEY);",
              "if (held == null || !held) playoutHeld = held = Settings.enabled(KEY) && Settings.available(KEY);",
              1
          )
          c = re.sub(r"NO_SOUND_MILLIS\s*=\s*3000\b", "NO_SOUND_MILLIS = 15000", c)
          c = c.replace(
              "now.mix.theirs.offer(sound, bytes, track.getChannelCount(), track.getSampleRate(), now.elapsed());",
              "if (sound == null || bytes <= 0) return;\n            ByteBuffer slice = sound.duplicate();\n            if (slice.position() > 0) slice.position(0);\n            if (bytes <= slice.capacity()) slice.limit(bytes);\n            now.mix.theirs.offer(slice, bytes, track.getChannelCount(), track.getSampleRate(), now.elapsed());",
              1
          )
          c = c.replace(
              "now.mix.mine.offer(sound, bytes, record.getChannelCount(), record.getSampleRate(), now.elapsed());",
              "if (sound == null || bytes <= 0) return;\n            ByteBuffer slice = sound.duplicate();\n            if (slice.position() > 0) slice.position(0);\n            if (bytes <= slice.capacity()) slice.limit(bytes);\n            now.mix.mine.offer(slice, bytes, record.getChannelCount(), record.getSampleRate(), now.elapsed());",
              1
          )
          c = c.replace(
              "view.setElevation(density * 24);",
              "view.setElevation(density * 32);\n        view.setTranslationZ(density * 32);",
              1
          )
          p.write_text(c, encoding="utf-8")
          print("Applied CallRecording.java enhancements successfully.")
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Generate Signing Keypair
        run: |
          python3 scripts/bundle_signature.py generate --key morphe-signing.key --public morphe-signing.pub

      - name: Run Unit Tests and Build Signed v0.30.0 MPP Bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :extensions:messenger:testDebugUnitTest :patches:buildAndroid --dependency-verification=off --no-daemon

      - name: Verify Signed MPP Bundle and Compute SHA-256
        run: |
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          python3 scripts/bundle_signature.py verify "$MPP_FILE" --public morphe-signing.pub
          sha256sum "$MPP_FILE" | tee SHA256SUMS.txt

      - name: Publish Release v0.30.0 and Update patches-bundle.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          MPP_NAME=$(basename "$MPP_FILE")
          TAG="v0.30.0"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" "$MPP_FILE" SHA256SUMS.txt \
            --title "HushMessenger v0.30.0" \
            --notes "Built from latest SysAdminDoc/HushMessenger ($(git rev-parse upstream/main)) with Messenger 586 call button wrapper fix (9622ba0), audio layer sizing fix (a31f2cf), CallRecording buffer/elevation fixes, and support for all 9 builds of Messenger 586.0.0.55.92."
          python3 - << 'EOF'
          import json, pathlib, datetime, os
          p = pathlib.Path("patches-bundle.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          repo = os.environ["REPO"]
          mpp_files = sorted(pathlib.Path("patches/build/libs").glob("patches-*.mpp"))
          mpp_name = mpp_files[0].name
          pub_key = pathlib.Path("morphe-signing.pub").read_text(encoding="utf-8").strip()
          d["version"] = "0.30.0"
          d["created_at"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S")
          d["download_url"] = f"https://github.com/{repo}/releases/download/v0.30.0/{mpp_name}"
          d["signature_download_url"] = ""
          d["public_key"] = pub_key
          p.write_text(json.dumps(d, indent=2) + "\n", encoding="utf-8")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- morphe-signing.key || true
          git diff --cached --quiet || git commit -m "chore(release): v0.30.0 synced with upstream SysAdminDoc/HushMessenger"
          git push --force origin HEAD:main
