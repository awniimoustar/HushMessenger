name: Build Latest HushMessenger Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-custom-mpp.yml"

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest upstream SysAdminDoc/HushMessenger
        run: |
          git remote add upstream https://github.com/SysAdminDoc/HushMessenger.git || git remote set-url upstream https://github.com/SysAdminDoc/HushMessenger.git
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "Upstream HEAD commit: $UPSTREAM_SHA"
          git checkout upstream/main -- patches extensions gradle scripts build.gradle.kts settings.gradle.kts settings-gradle.lockfile gradle.properties gradlew gradlew.bat README.md CHANGELOG.md patches-list.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Generate Signing Keypair
        run: |
          if [ ! -f morphe-signing.key ]; then
            python3 scripts/bundle_signature.py generate --key morphe-signing.key --public morphe-signing.pub
          fi

      - name: Run Tests and Build Signed MPP Bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:test :extensions:messenger:testDebugUnitTest :patches:buildAndroid --dependency-verification=off --no-daemon
          python3 -m unittest discover -s scripts/tests -v

      - name: Verify Signed MPP Bundle and Compute SHA-256
        run: |
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          python3 scripts/bundle_signature.py verify "$MPP_FILE" --public morphe-signing.pub
          sha256sum "$MPP_FILE" | tee SHA256SUMS.txt

      - name: Publish Release and Update patches-bundle.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          MPP_NAME=$(basename "$MPP_FILE")
          UPSTREAM_SHORT=$(git rev-parse --short upstream/main)
          TAG="v0.29.0-${UPSTREAM_SHORT}"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" "$MPP_FILE" SHA256SUMS.txt \
            --title "HushMessenger $TAG (Latest Upstream $UPSTREAM_SHORT)" \
            --notes "Built from SysAdminDoc/HushMessenger commit $(git rev-parse upstream/main) including call button wrapper fix 9622ba06cb93067be41ea7e561ca478c678d807d and call recording fix a31f2cf4e38df38260ba351ddda9afeb17d8dc46."
          python3 - << 'EOF'
          import json, pathlib, datetime, os, subprocess
          p = pathlib.Path("patches-bundle.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          repo = os.environ["REPO"]
          short_sha = subprocess.check_output(["git", "rev-parse", "--short", "upstream/main"], text=True).strip()
          tag = f"v0.29.0-{short_sha}"
          mpp_files = sorted(pathlib.Path("patches/build/libs").glob("patches-*.mpp"))
          mpp_name = mpp_files[0].name
          pub_key = pathlib.Path("morphe-signing.pub").read_text(encoding="utf-8").strip()
          d["version"] = f"0.29.0-{short_sha}"
          d["created_at"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S")
          d["download_url"] = f"https://github.com/{repo}/releases/download/{tag}/{mpp_name}"
          d["signature_download_url"] = ""
          d["public_key"] = pub_key
          p.write_text(json.dumps(d, indent=2) + "\n", encoding="utf-8")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- morphe-signing.key || true
          git diff --cached --quiet || git commit -m "chore(release): publish bundle built from upstream $(git rev-parse --short upstream/main)"
          git push origin HEAD:main
