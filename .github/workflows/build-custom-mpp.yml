name: Build Custom MPP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Patch CallRecording.java
        run: python3 -c 'import pathlib, re; p=pathlib.Path("extensions/messenger/src/main/java/app/hushmessenger/extension/CallRecording.java"); c=p.read_text(encoding="utf-8"); c=c.replace("if (held == null) playoutHeld = held = Settings.enabled(KEY) && Settings.available(KEY);", "if (held == null || !held) playoutHeld = held = Settings.enabled(KEY) && Settings.available(KEY);"); c=re.sub(r"NO_SOUND_MILLIS\s*=\s*3000\b", "NO_SOUND_MILLIS = 15000", c); c=c.replace("view.setElevation(density * 24);", "view.setElevation(density * 32);\n        view.setTranslationZ(density * 32);"); p.write_text(c, encoding="utf-8")'

      - name: Build Android Patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chmod +x gradlew && ./gradlew :patches:buildAndroid --no-daemon

      - name: Sign MPP Bundle
        run: python3 scripts/bundle_signature.py generate --key secret.key --public morphe-signing.pub && python3 scripts/bundle_signature.py sign $(ls patches/build/libs/patches-*.mpp | head -n 1) --key secret.key

      - name: Publish Release and Update Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: MPP_FILE=$(ls patches/build/libs/patches-*.mpp | head -n 1) && MPP_NAME=$(basename "$MPP_FILE") && TAG="v0.29.0-callfix" && (gh release delete "$TAG" -y || true) && gh release create "$TAG" "$MPP_FILE" --title "HushMessenger $TAG (Call Recording Fix)" --notes "Custom build" && python3 -c 'import json, pathlib, datetime, os; p=pathlib.Path("patches-bundle.json"); d=json.loads(p.read_text(encoding="utf-8")); repo=os.environ.get("REPO","awniimoustar/HushMessenger"); tag="v0.29.0-callfix"; mpp=os.path.basename(os.popen("ls patches/build/libs/patches-*.mpp").read().strip().split()[0]); d["version"]=tag; d["created_at"]=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); d["download_url"]=f"https://github.com/{repo}/releases/download/{tag}/{mpp}"; p.write_text(json.dumps(d, indent=2)+"\n", encoding="utf-8")' && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add patches-bundle.json morphe-signing.pub extensions/messenger/src/main/java/app/hushmessenger/extension/CallRecording.java && (git diff --cached --quiet || git commit -m "chore(release): publish custom call-recording fix bundle") && git push origin HEAD:main
